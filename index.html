<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  .scene { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background-size: cover; background-position: center; opacity: 0; transition: opacity 3s; }
  .scene.on { opacity: 1; }
  #shade { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0) 35%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5)); }
  #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
  #info { position: fixed; left: 5vw; top: 5vh; text-shadow: 0 0.2vw 1vw rgba(0,0,0,0.5); }
  #clock { font-size: 10vw; font-weight: 200; line-height: 1; letter-spacing: -0.2vw; }
  #line { font-size: 1.8vw; margin-top: 1vw; opacity: 0.9; }
  #dock { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%);
    display: flex; padding: 1.2vw; border-radius: 2vw; white-space: nowrap;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .tile { width: 9vw; height: 9vw; margin: 0 0.6vw; border-radius: 1.4vw;
    background: rgba(0,0,0,0.35); border: 0.25vw solid transparent; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    outline: none; transition: transform 0.2s; }
  .tile:focus { border-color: #fff; background: rgba(255,255,255,0.25); transform: scale(1.12); }
  .icon { font-size: 3.4vw; line-height: 1; }
  .name { font-size: 1vw; margin-top: 0.6vw; }
</style>
</head>
<body>
<div class="scene" id="s0"></div><div class="scene" id="s1"></div>
<div id="shade"></div>
<canvas id="fx"></canvas>
<div id="info"><div id="clock"></div><div id="line"></div></div>
<div id="dock"></div>
<script>
// Photo scenes that follow Barcelona's real sun position and weather, rain/snow drawn on top.
// Preview: ?h=20.5 (hour) and/or ?w=clear|clouds|rain|snow|storm|fog
(function () {
  var LAT = 41.39, LON = 2.17, RAD = Math.PI / 180;
  // Unsplash photos (free licence, hotlinked as Unsplash asks)
  var IMG = "https://images.unsplash.com/", Q = "?w=1920&q=80&fm=jpg&fit=crop";
  var SCENES = { sunrise: "photo-1753372623416-bc8bf85eab06", day: "photo-1790516476371-ae44e1b2195d",
    sunset: "photo-1713545717410-fdb2de7ce677", night: "photo-1569266318139-f96482583203",
    grey: "photo-1632090255904-d3d840ceedc2" };
  var q = {}; location.search.replace(/[?&](\w+)=([^&]*)/g, function (_, k, v) { q[k] = v; });
  var wx = { code: 0, cloud: 0, rain: 0, snow: 0, storm: false, temp: null };

  function sunElev(d) { // degrees; ignores equation of time (max ~4° error)
    var day = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
    var decl = -23.44 * RAD * Math.cos(2 * Math.PI / 365 * (day + 10));
    var ha = (d.getUTCHours() + d.getUTCMinutes() / 60 + LON / 15 - 12) * 15 * RAD;
    return Math.asin(Math.sin(LAT * RAD) * Math.sin(decl) + Math.cos(LAT * RAD) * Math.cos(decl) * Math.cos(ha)) / RAD;
  }
  console.assert(sunElev(new Date(Date.UTC(2026, 5, 21, 11, 51))) > 70 &&
    Math.abs(sunElev(new Date(Date.UTC(2026, 11, 21, 11, 51))) - 25) < 3 &&
    sunElev(new Date(Date.UTC(2026, 5, 21, 23, 50))) < -20, "sunElev");

  function pickScene(e, hour, w) {
    if (e < -6) return "night";
    if (e < 8) return hour < 13 ? "sunrise" : "sunset";
    return w.cloud >= 0.7 || w.rain || w.snow ? "grey" : "day";
  }
  console.assert(pickScene(-10, 23, wx) === "night" && pickScene(3, 8, wx) === "sunrise" &&
    pickScene(3, 18, wx) === "sunset" && pickScene(30, 12, wx) === "day" &&
    pickScene(30, 12, { cloud: 0.2, rain: 1 }) === "grey", "pickScene");

  var WORDS = [[0, "Klar"], [2, "Leicht bewölkt"], [3, "Bewölkt"], [48, "Nebel"], [57, "Nieselregen"],
    [67, "Regen"], [77, "Schnee"], [82, "Regenschauer"], [86, "Schneeschauer"], [99, "Gewitter"]];
  function word(code) { for (var i = 0; i < WORDS.length; i++) if (code <= WORDS[i][0]) return WORDS[i][1]; return ""; }

  function setWeather(code, cloud, precip, temp) { // WMO weather codes from Open-Meteo
    wx.code = code; wx.cloud = cloud / 100; wx.temp = temp;
    wx.rain = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95 ? Math.min(1, 0.4 + precip / 4) : 0;
    wx.snow = (code >= 71 && code <= 77) || code === 85 || code === 86 ? 1 : 0;
    wx.storm = code >= 95;
    tick();
  }
  var DEMO = { clear: [0, 0, 0, 22], clouds: [3, 85, 0, 17], rain: [63, 100, 2, 14], snow: [73, 100, 0, -1],
    storm: [95, 100, 4, 19], fog: [45, 60, 0, 12] };
  function loadWeather() {
    var x = new XMLHttpRequest();
    x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=weather_code,cloud_cover,precipitation,temperature_2m");
    x.onload = function () {
      try { var c = JSON.parse(x.responseText).current;
        setWeather(c.weather_code, c.cloud_cover, c.precipitation, c.temperature_2m); } catch (e) {}
    };
    x.send(); // on failure: scene by time only, no weather text
  }

  function now() {
    var d = new Date();
    if (q.h) { d.setHours(0, 0, 0, 0); d.setTime(d.getTime() + parseFloat(q.h) * 3600e3); }
    return d;
  }

  var DAYS = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  var MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  var layers = [document.getElementById("s0"), document.getElementById("s1")], front = 0, shown = "";
  function tick() {
    var d = now(), name = pickScene(sunElev(d), d.getHours(), wx);
    if (name !== shown) { // crossfade: load into the hidden layer, then fade it in
      var back = layers[1 - front], url = IMG + SCENES[name] + Q, img = new Image();
      img.onload = function () {
        back.style.backgroundImage = "url(" + url + ")";
        back.className = "scene on"; layers[front].className = "scene"; front = 1 - front;
      };
      img.src = url; shown = name;
    }
    document.getElementById("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    document.getElementById("line").textContent = DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] +
      (wx.temp === null ? "" : "  ·  " + Math.round(wx.temp) + "°  " + word(wx.code));
  }

  if (DEMO[q.w]) setWeather.apply(null, DEMO[q.w]); else { loadWeather(); setInterval(loadWeather, 15 * 60 * 1000); }
  tick(); setInterval(tick, 10000);

  // rain / snow / lightning on top of the photo
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d"), W, H, drops = [], i, flash = 0, last = 0;
  for (i = 0; i < 180; i++) drops.push([Math.random(), Math.random(), 0.6 + Math.random() * 0.6]);
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  window.addEventListener("resize", resize); resize();
  function frame(t) {
    raf(frame);
    if (t - last < 40) return; // ~25 fps, kind to TV CPUs
    last = t;
    ctx.clearRect(0, 0, W, H);
    if (wx.cloud > 0.5 && shown !== "grey") { ctx.fillStyle = "rgba(20,24,32," + (wx.cloud - 0.5) * 0.5 + ")"; ctx.fillRect(0, 0, W, H); }
    if (wx.rain || wx.snow) {
      ctx.strokeStyle = ctx.fillStyle = wx.snow ? "rgba(255,255,255,0.85)" : "rgba(210,220,240,0.35)";
      ctx.lineWidth = 1.5; ctx.beginPath();
      for (i = 0; i < drops.length * (wx.snow || wx.rain); i++) {
        var p = drops[i], v = wx.snow ? 0.00006 : 0.0011;
        var px = ((p[0] + (wx.snow ? Math.sin(t / 1500 + i) * 0.01 : t * v * 0.12)) % 1) * W, py = ((p[1] + t * v * p[2]) % 1) * H;
        if (wx.snow) ctx.rect(px, py, 3, 3); else { ctx.moveTo(px, py); ctx.lineTo(px - 3, py + H * 0.035); }
      }
      if (wx.snow) ctx.fill(); else ctx.stroke();
    }
    if (wx.storm && Math.random() < 0.004) flash = 1;
    if (flash > 0.05) { ctx.fillStyle = "rgba(255,255,255," + flash * 0.6 + ")"; ctx.fillRect(0, 0, W, H); flash *= 0.75; }
  }
  var raf = window.requestAnimationFrame || function (f) { setTimeout(function () { f(Date.now()); }, 40); };
  raf(frame);
})();
</script>
<script>
// Deine Apps: { name, url, icon }. icon = Emoji oder 1-2 Buchstaben.
var APPS = [
  { name: "YouTube", url: "https://www.youtube.com/tv", icon: "Y" },
  { name: "Smart Home (bald)", url: "#", icon: "S" }
];

var dock = document.getElementById("dock"), tiles = [], cur = 0;

APPS.forEach(function (app) {
  var t = document.createElement("div");
  t.className = "tile";
  t.tabIndex = 0;
  t.innerHTML = '<div class="icon"></div><div class="name"></div>';
  t.firstChild.textContent = app.icon;
  t.lastChild.textContent = app.name;
  dock.appendChild(t);
  tiles.push(t);
});

function next(i, key, n) { // one row: left/right only
  if (key === "ArrowLeft") return Math.max(i - 1, 0);
  if (key === "ArrowRight") return Math.min(i + 1, n - 1);
  return i;
}
console.assert(next(0, "ArrowLeft", 3) === 0 && next(0, "ArrowRight", 3) === 1 && next(2, "ArrowRight", 3) === 2 &&
  next(1, "ArrowDown", 3) === 1, "nav");

function focus(i) { cur = i; tiles[cur].focus(); }

var KEYS = { 37: "ArrowLeft", 38: "ArrowUp", 39: "ArrowRight", 40: "ArrowDown" };

document.addEventListener("keydown", function (e) {
  var key = e.key || KEYS[e.keyCode]; // old TV Chromium may only set keyCode
  if (KEYS[e.keyCode]) key = KEYS[e.keyCode];
  if (key === "Enter" || e.keyCode === 13) {
    window.location.href = APPS[cur].url;
  } else if (key === "Backspace" || key === "GoBack" || e.keyCode === 8 || e.keyCode === 461) {
    e.preventDefault();
    window.close(); // the launcher has one page, so Back always exits (VIDAA requires this)
  } else if (/^Arrow/.test(key)) {
    e.preventDefault();
    focus(next(cur, key, tiles.length));
  }
});

focus(0);
</script>
</body>
</html>
