<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #f2f2f2;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  #bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
  #grid { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    height: 100%; padding: 4vh 4vw; box-sizing: border-box; }
  .tile { width: 18vw; height: 18vw; margin: 1.5vw; border-radius: 1.2vw;
    background: rgba(16, 16, 20, 0.55); border: 0.4vw solid transparent; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    outline: none; text-shadow: 0 0.2vw 0.6vw rgba(0, 0, 0, 0.6); }
  .tile:focus { border-color: #ffffff; background: rgba(30, 30, 36, 0.75); }
  .icon { font-size: 6vw; line-height: 1; }
  .name { font-size: 2.2vw; margin-top: 1.5vw; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="grid"></div>
<script>
// Live background: Barcelona landscape following the real sun position and weather.
// Preview: ?h=20.5 (hour) and/or ?w=clear|clouds|rain|snow|storm|fog
(function () {
  var LAT = 41.39, LON = 2.17, RAD = Math.PI / 180;
  var cv = document.getElementById("bg"), ctx = cv.getContext("2d"), W, H;
  var q = {}; location.search.replace(/[?&](\w+)=([^&]*)/g, function (_, k, v) { q[k] = v; });
  var wx = { cloud: 0, rain: 0, snow: 0, storm: false, fog: false };

  function sunElev(d) { // degrees; ignores equation of time (max ~4° error), fine for colours
    var day = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
    var decl = -23.44 * RAD * Math.cos(2 * Math.PI / 365 * (day + 10));
    var ha = (d.getUTCHours() + d.getUTCMinutes() / 60 + LON / 15 - 12) * 15 * RAD;
    return Math.asin(Math.sin(LAT * RAD) * Math.sin(decl) + Math.cos(LAT * RAD) * Math.cos(decl) * Math.cos(ha)) / RAD;
  }
  console.assert(sunElev(new Date(Date.UTC(2026, 5, 21, 11, 51))) > 70 &&
    Math.abs(sunElev(new Date(Date.UTC(2026, 11, 21, 11, 51))) - 25) < 3 &&
    sunElev(new Date(Date.UTC(2026, 5, 21, 23, 50))) < -20, "sunElev");

  function setWeather(code, cloud, precip) { // WMO weather codes from Open-Meteo
    wx.cloud = cloud / 100;
    wx.rain = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95 ? Math.min(1, 0.4 + precip / 4) : 0;
    wx.snow = (code >= 71 && code <= 77) || code === 85 || code === 86 ? 1 : 0;
    wx.storm = code >= 95;
    wx.fog = code === 45 || code === 48;
  }
  var DEMO = { clear: [0, 0, 0], clouds: [3, 85, 0], rain: [63, 100, 2], snow: [73, 100, 0], storm: [95, 100, 4], fog: [45, 60, 0] };

  function loadWeather() {
    var x = new XMLHttpRequest();
    x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=weather_code,cloud_cover,precipitation");
    x.onload = function () {
      try { var c = JSON.parse(x.responseText).current; setWeather(c.weather_code, c.cloud_cover, c.precipitation); } catch (e) {}
    };
    x.send(); // on failure the sky simply stays clear
  }
  if (DEMO[q.w]) setWeather.apply(null, DEMO[q.w]); else { loadWeather(); setInterval(loadWeather, 15 * 60 * 1000); }

  function now() {
    var d = new Date();
    if (q.h) { d.setHours(0, 0, 0, 0); d.setTime(d.getTime() + parseFloat(q.h) * 3600e3); }
    return d;
  }

  // colour helpers: [r,g,b]
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgb(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a === undefined ? 1 : a) + ")"; }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  // sky [elevation, top, horizon]: night, twilight, golden hour, day
  var SKY = [[-18, [8, 12, 34], [22, 30, 66]], [-8, [28, 38, 88], [150, 80, 110]],
             [0, [60, 90, 160], [245, 160, 90]], [10, [55, 130, 214], [170, 212, 245]]];
  function sky(e) {
    if (e <= SKY[0][0]) return [SKY[0][1], SKY[0][2]];
    for (var i = 1; i < SKY.length; i++) if (e <= SKY[i][0]) {
      var t = (e - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]);
      return [mix(SKY[i - 1][1], SKY[i][1], t), mix(SKY[i - 1][2], SKY[i][2], t)];
    }
    return [SKY[3][1], SKY[3][2]];
  }
  function grey(c) { var l = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11; return [l, l, l * 1.05]; }

  // fixed random scene so it never jumps between frames
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var stars = [], clouds = [], drops = [], i;
  for (i = 0; i < 90; i++) stars.push([rnd(), rnd() * 0.6, rnd() * 6]);
  for (i = 0; i < 9; i++) clouds.push([rnd(), 0.05 + rnd() * 0.3, 0.6 + rnd() * 0.8, 0.00002 + rnd() * 0.00003]);
  for (i = 0; i < 160; i++) drops.push([rnd(), rnd(), 0.6 + rnd() * 0.6]);
  var HILLS = [[0.62, 0.07, [70, 90, 120], 1.3], [0.70, 0.06, [50, 80, 70], 2.1], [0.80, 0.05, [35, 62, 45], 3.4]];

  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  window.addEventListener("resize", resize); resize();

  var flash = 0, last = 0;
  function frame(t) {
    raf(frame);
    if (t - last < 50) return; // ~20 fps is plenty and kind to TV CPUs
    last = t;
    var d = now(), e = sunElev(d), c = wx.cloud * (wx.rain || wx.snow ? 1 : 0.8);
    var light = clamp((e + 10) / 22) * (1 - c * 0.45) + 0.06;
    var s = sky(e), top = mix(s[0], grey(s[0]), c * 0.8), hor = mix(s[1], grey(s[1]), c * 0.8);

    var g = ctx.createLinearGradient(0, 0, 0, H * 0.8);
    g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(hor));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var sa = clamp((-6 - e) / 8) * (1 - c);
    for (i = 0; i < stars.length; i++) {
      ctx.fillStyle = "rgba(255,255,255," + sa * (0.5 + 0.5 * Math.sin(t / 900 + stars[i][2])) + ")";
      ctx.fillRect(stars[i][0] * W, stars[i][1] * H, 2, 2);
    }

    var hr = d.getHours() + d.getMinutes() / 60;
    if (e > -4) { // sun travels left to right and sets behind the hills
      var sx = W * (0.5 + (hr - 13.5) / 15), sy = H * 0.66 - (e / 75) * H * 0.6, so = (1 - c * 0.85) * clamp((e + 4) / 4);
      var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.25);
      sg.addColorStop(0, "rgba(255,230,170," + 0.55 * so + ")"); sg.addColorStop(1, "rgba(255,200,120,0)");
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = rgb(mix([255, 170, 80], [255, 250, 225], clamp(e / 20)), so);
      ctx.beginPath(); ctx.arc(sx, sy, H * 0.035, 0, 7); ctx.fill();
    } else { // moon
      var mx = W * (0.5 + (((hr + 12) % 24) - 13.5) / 15), mo = 1 - c * 0.85;
      ctx.fillStyle = "rgba(235,235,220," + mo + ")";
      ctx.beginPath(); ctx.arc(mx, H * 0.2, H * 0.03, 0, 7); ctx.fill();
    }

    for (i = 0; i < Math.round(wx.cloud * clouds.length); i++) {
      var k = clouds[i], cx = ((k[0] + t * k[3]) % 1.4 - 0.2) * W, cy = k[1] * H, r = k[2] * H * 0.06;
      ctx.fillStyle = rgb(mix([255, 255, 255], [110, 115, 125], wx.rain || wx.snow ? 0.6 : 0.1), 0.85 * Math.max(light, 0.25));
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 7); ctx.arc(cx + r * 1.1, cy - r * 0.4, r * 1.2, 0, 7);
      ctx.arc(cx + r * 2.2, cy, r * 0.9, 0, 7); ctx.rect(cx, cy, r * 2.2, r * 0.9);
      ctx.fill();
    }

    for (i = 0; i < HILLS.length; i++) {
      var hl = HILLS[i];
      ctx.fillStyle = rgb(mix([10, 12, 22], hl[2], light));
      ctx.beginPath(); ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += W / 60) {
        var u = x / W * hl[3] * 3;
        ctx.lineTo(x, H * hl[0] - H * hl[1] * (Math.sin(u) * 0.6 + Math.sin(u * 2.3 + i) * 0.3 + Math.sin(u * 5.1) * 0.1));
      }
      ctx.lineTo(W, H); ctx.fill();
    }

    if (wx.rain || wx.snow) {
      var n = drops.length * (wx.snow || wx.rain);
      ctx.strokeStyle = ctx.fillStyle = wx.snow ? "rgba(255,255,255,0.8)" : "rgba(190,205,230,0.45)";
      ctx.lineWidth = 1.5; ctx.beginPath();
      for (i = 0; i < n; i++) {
        var p = drops[i], v = wx.snow ? 0.00006 : 0.0009;
        var px = ((p[0] + (wx.snow ? Math.sin(t / 1500 + i) * 0.01 : t * v * 0.15)) % 1) * W, py = ((p[1] + t * v * p[2]) % 1) * H;
        if (wx.snow) ctx.rect(px, py, 3, 3); else { ctx.moveTo(px, py); ctx.lineTo(px - 3, py + H * 0.03); }
      }
      wx.snow ? ctx.fill() : ctx.stroke();
    }

    if (wx.fog) {
      var fg = ctx.createLinearGradient(0, 0, 0, H), fc = mix([40, 44, 52], [205, 210, 218], clamp(light));
      fg.addColorStop(0, rgb(fc, 0.35)); fg.addColorStop(0.6, rgb(fc, 0.75)); fg.addColorStop(1, rgb(fc, 0.85));
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
    }

    if (wx.storm && Math.random() < 0.004) flash = 1;
    if (flash > 0.05) { ctx.fillStyle = "rgba(255,255,255," + flash * 0.6 + ")"; ctx.fillRect(0, 0, W, H); flash *= 0.75; }
  }
  var raf = window.requestAnimationFrame || function (f) { setTimeout(function () { f(Date.now()); }, 50); };
  raf(frame);
})();
</script>
<script>
// Deine Apps: { name, url, icon }. icon = Emoji oder 1-2 Buchstaben.
var APPS = [
  { name: "YouTube", url: "https://www.youtube.com/tv", icon: "Y" },
  { name: "Smart Home (bald)", url: "#", icon: "S" }
];

var grid = document.getElementById("grid"), tiles = [], cur = 0;

APPS.forEach(function (app) {
  var t = document.createElement("div");
  t.className = "tile";
  t.tabIndex = 0;
  t.innerHTML = '<div class="icon"></div><div class="name"></div>';
  t.firstChild.textContent = app.icon;
  t.lastChild.textContent = app.name;
  grid.appendChild(t);
  tiles.push(t);
});

function cols() { // tiles in the first row, so wrapping works at any TV resolution
  for (var i = 1; i < tiles.length; i++) if (tiles[i].offsetTop !== tiles[0].offsetTop) return i;
  return tiles.length;
}

function next(i, key, n, c) {
  if (key === "ArrowLeft") return Math.max(i - 1, 0);
  if (key === "ArrowRight") return Math.min(i + 1, n - 1);
  if (key === "ArrowUp") return i - c >= 0 ? i - c : i;
  if (key === "ArrowDown") return i + c < n ? i + c : (Math.floor(i / c) < Math.floor((n - 1) / c) ? n - 1 : i); // short last row: jump to its last tile
  return i;
}
console.assert(next(0, "ArrowLeft", 5, 3) === 0 && next(1, "ArrowDown", 5, 3) === 4 &&
  next(2, "ArrowDown", 5, 3) === 4 && next(3, "ArrowDown", 5, 3) === 3 && next(2, "ArrowDown", 5, 4) === 4 && next(4, "ArrowUp", 5, 3) === 1, "nav");

function focus(i) { cur = i; tiles[cur].focus(); }

var KEYS = { 37: "ArrowLeft", 38: "ArrowUp", 39: "ArrowRight", 40: "ArrowDown" };

document.addEventListener("keydown", function (e) {
  var key = e.key || KEYS[e.keyCode]; // old TV Chromium may only set keyCode
  if (KEYS[e.keyCode]) key = KEYS[e.keyCode];
  if (key === "Enter" || e.keyCode === 13) {
    window.location.href = APPS[cur].url;
  } else if (key === "Backspace" || key === "GoBack" || e.keyCode === 8 || e.keyCode === 461) {
    e.preventDefault();
    window.close(); // the launcher has one page, so Back always exits (VIDAA requires this)
  } else if (/^Arrow/.test(key)) {
    e.preventDefault();
    focus(next(cur, key, tiles.length, cols()));
  }
});

focus(0);
</script>
</body>
</html>
